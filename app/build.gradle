plugins { id 'com.android.application' }

// Safe default: API access is directed ONLY to Telegram test data centers.
// A production-capable binary requires deliberate, separate build approval.
def telegramEnvironment = providers.gradleProperty('telegramEnvironment').orElse('test').get()
// Fail closed if someone attempts to assemble the test-data-center variant using
// production configuration. This is NOT a production release channel.
if (gradle.startParameter.taskNames.any {
        def task = it.toLowerCase(java.util.Locale.ROOT)
        task.contains('sandboxdc') || task.contains('networkdc')
    } && telegramEnvironment != 'test')
    throw new GradleException('sandboxDc/networkDc APK must always use telegramEnvironment=test')
def productionApproved = providers.gradleProperty('approveProductionBuild').orElse('false').get() == 'true'
if (!(telegramEnvironment in ['test', 'production']))
    throw new GradleException('telegramEnvironment must be test or production')
if (telegramEnvironment == 'production' && !productionApproved)
    throw new GradleException('Production Telegram connection is disabled: set approveProductionBuild=true after security review')


def telegramId = providers.gradleProperty('telegramApiId').orElse('0').get()
def telegramHash = providers.gradleProperty('telegramApiHash').orElse('').get()
if (!(telegramId ==~ /\d+/)) throw new GradleException('telegramApiId must be a number')
if (!(telegramHash ==~ /[a-fA-F0-9]{0,64}/)) throw new GradleException('Invalid telegramApiHash characters')

android {
    namespace 'org.vault.exporter'
    compileSdk 35
    defaultConfig {
        // Different Android application IDs keep test/production credentials and
        // TDLib databases isolated even on the same phone.
        applicationId telegramEnvironment == 'test' ? 'org.vault.exporter.sandbox' : 'org.vault.exporter'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.9-test-gated-alpha'
        buildConfigField 'boolean', 'TELEGRAM_TEST_DC', telegramEnvironment == 'test' ? 'true' : 'false'
        buildConfigField 'boolean', 'ALLOW_PRODUCTION', productionApproved ? 'true' : 'false'
        // Never enable a network connection in the offline debug or sandbox build.
        buildConfigField 'boolean', 'ALLOW_TEST_DC_NETWORK', 'false'
        buildConfigField 'int', 'TELEGRAM_API_ID', telegramId
        buildConfigField 'String', 'TELEGRAM_API_HASH', '"' + telegramHash + '"'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false }
        // Developer-only network test build: a SEPARATE app, isolated from both
        // production Telegram and the strictly offline screenshot/debug demo.
        // Always targets Telegram TEST data centers, never production.
        sandboxDc {
            initWith release
            signingConfig signingConfigs.debug
            minifyEnabled false
            applicationIdSuffix '.testnet'
            versionNameSuffix '-networkdc'
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'TELEGRAM_TEST_DC', 'true'
            buildConfigField 'boolean', 'ALLOW_PRODUCTION', 'false'
        }
        // Deliberate, non-debuggable NETWORK test build. Separate package,
        // explicitly opt-in, only TEST DC. Offline variants remain disconnected.
        networkDc {
            initWith release
            signingConfig signingConfigs.debug  // alpha QA only, never distribute as release
            minifyEnabled false
            applicationIdSuffix '.networktest'
            versionNameSuffix '-networkdc-network'
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'TELEGRAM_TEST_DC', 'true'
            buildConfigField 'boolean', 'ALLOW_PRODUCTION', 'false'
            buildConfigField 'boolean', 'ALLOW_TEST_DC_NETWORK', 'true'
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
}

// A seemingly valid APK without official TDLib cannot export anything.
// Reject such builds instead of distributing a misleading installation file.
tasks.register('verifyExporterBuild') {
    doLast {
        File td = file('src/main/jniLibs/arm64-v8a/libtdjson.so')
        if (!td.isFile() || td.length() < 512000L)
            throw new GradleException('Missing official Android arm64-v8a TDLib binary: libtdjson.so')
        if (telegramEnvironment == 'production' && !productionApproved)
            throw new GradleException('Production mode requires explicit approval')
        // Never quietly build network networkDc for production.
        if (gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('networkdc') }
                && telegramEnvironment != 'test')
            throw new GradleException('Network networkDc APK must use Telegram test environment')
        // Offline-only APKs must never request real Telegram credentials. This
        // exception is *only* for a single explicit test-environment task whose
        // manifest removes INTERNET, with an independently enforced UI fence.
        // Any other task (including assembleNetworkDc / assembleRelease / assemble)
        // still requires the developer's API credentials.
        def tasksRequested = gradle.startParameter.taskNames
        def offlineBuildType = tasksRequested.size() == 1 &&
            tasksRequested[0].toLowerCase(java.util.Locale.ROOT).endsWith('assemblesandboxdc')
                ? 'sandboxDc'
                : (tasksRequested.size() == 1 &&
                   tasksRequested[0].toLowerCase(java.util.Locale.ROOT).endsWith('assembledebug')
                     ? 'debug' : null)
        def offlineManifest = offlineBuildType == null ? null :
            file("src/${offlineBuildType}/AndroidManifest.xml")
        def activitySource = file('src/main/java/org/vault/exporter/MainActivity.java').text
        def offlineDemoOnly = telegramEnvironment == 'test' && offlineManifest != null &&
            offlineManifest.isFile() &&
            offlineManifest.text.contains('tools:node="remove"') &&
            activitySource.contains('BuildConfig.TELEGRAM_TEST_DC && !BuildConfig.ALLOW_TEST_DC_NETWORK') &&
            activitySource.contains('if (BuildConfig.DEBUG || (BuildConfig.TELEGRAM_TEST_DC && !BuildConfig.ALLOW_TEST_DC_NETWORK)')
        def noEmbeddedKeysNetworkDc = telegramEnvironment == 'test' &&
            tasksRequested.size() == 1 &&
            tasksRequested[0].toLowerCase(java.util.Locale.ROOT).endsWith('assemblenetworkdc') &&
            activitySource.contains('requestTestDcApiCredentials()') &&
            activitySource.contains('BuildConfig.ALLOW_TEST_DC_NETWORK ? testApiId : BuildConfig.TELEGRAM_API_ID') &&
            activitySource.contains('BuildConfig.ALLOW_TEST_DC_NETWORK ? testApiHash : BuildConfig.TELEGRAM_API_HASH')
        if (offlineDemoOnly || noEmbeddedKeysNetworkDc) {
            if (telegramId != '0' || telegramHash != '')
                throw new GradleException('QA APK must embed NO Telegram API credentials')
        } else if (!(telegramId ==~ /[1-9][0-9]*/) || !(telegramHash ==~ /[a-fA-F0-9]{32}/)) {
            throw new GradleException('Missing developer Telegram API credentials (telegramApiId/telegramApiHash)')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(tasks.named('verifyExporterBuild')) }
