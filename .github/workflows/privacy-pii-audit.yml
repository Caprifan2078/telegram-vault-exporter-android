name: Privacy PII review (no raw values)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan-current-pii:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Count potential personal information without outputting values
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, pathlib, re, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          patterns = {
              'email': re.compile(r'(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'),
              'russian_phone': re.compile(r'(?<!\d)\+7(?:[ ()-]*\d){10}(?!\d)'),
              'full_name': re.compile(r'\b[А-ЯЁ][а-яё]{2,}\s+[А-ЯЁ][а-яё]{2,}\s+[А-ЯЁ][а-яё]{2,}\b'),
          }
          counts = collections.Counter()
          sources = collections.defaultdict(set)
          skipped = 0
          def fingerprint(path):
              h = 2166136261
              for byte in path.encode('utf-8'):
                  h = ((h ^ byte) * 16777619) & 0xffffffff
              return f'{h:08x}'
          for raw in files:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode('utf-8', errors='replace'))
              try:
                  if not path.is_file() or path.stat().st_size > 2_000_000:
                      skipped += 1
                      continue
                  content = path.read_bytes()
              except OSError:
                  skipped += 1
                  continue
              if b'\0' in content:
                  skipped += 1
                  continue
              text = content.decode('utf-8', errors='replace')
              for kind, expression in patterns.items():
                  hits = expression.findall(text)
                  if kind == 'email':
                      hits = [x for x in hits if not re.search(r'(?i)@(example\.(com|org|net)|test\.(com|org)|users\.noreply\.github\.com)$', x)]
                  if hits:
                      counts[kind] += len(hits)
                      sources[kind].add(fingerprint(str(path)))
          print('Current tracked-text privacy scan (no personal values printed):')
          for kind in patterns:
              print(f'{kind}: {counts[kind]} potential matches across {len(sources[kind])} files')
              if sources[kind]:
                  print(f'{kind} source fingerprints: {", ".join(sorted(sources[kind]))}')
          print(f'Skipped unreadable, binary or oversized files: {skipped}')
          print('NOTE: possible matches require human review; this check does not certify privacy.')
          if sum(counts.values()):
              raise SystemExit('Privacy check failed: review potential personal data before merging.')
          PY
