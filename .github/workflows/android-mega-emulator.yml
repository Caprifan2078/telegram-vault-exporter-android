name: One-shot offline Android emulator mega stress (no Telegram access)

# User-authorized QA: final Android UI offline-notice visibility and JNI smoke after verified million-word export.
# Automatically starts ONLY when this particular workflow is created/changed.
on:
  push:
    branches:
      - feat/isolated-testdc-android-build-20261026
    paths:
      - .github/workflows/android-mega-emulator.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-android-emulator-mega-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator-mega:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TELEGRAM_TEST_DC_ONLY: 'true'
    steps:
      - name: Checkout source (no write token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Setup Android SDK using preinstalled commandline-tools
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;26.3.11579264'
      - name: Restore pinned official TDLib arm64 binary cache
        id: tdlib-binary-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libtdjson.so
            build/tdlib-provenance/verified-build.json
          key: vault-tdlib-arm64-ea3f69ce-openssl359-ndk263-v1-${{ hashFiles('scripts/build_official_tdlib_android.sh', 'scripts/prepare_tdlib_android.py') }}
      - name: Verify binary provenance and cache (never compile untrusted native code)
        run: |
          test "${{ steps.tdlib-binary-cache.outputs.cache-hit }}" = 'true'
          python3 scripts/verify_tdlib_elf.py app/src/main/jniLibs/arm64-v8a/libtdjson.so
          python3 - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('app/src/main/jniLibs/arm64-v8a/libtdjson.so').read_bytes()
          p=json.loads(pathlib.Path('build/tdlib-provenance/verified-build.json').read_text())
          assert hashlib.sha256(d).hexdigest()==p['sha256']
          assert p['commit']=='ea3f69ce11aef458bfbb09869b809ede4447486f'
          PY
      - name: Build two separate credential-free OFFLINE Android variants
        run: |
          gradle --no-daemon :app:assembleDebug -PtelegramEnvironment=test -PtelegramApiId=0 -PtelegramApiHash=
          gradle --no-daemon :app:assembleSandboxDc -PtelegramEnvironment=test -PtelegramApiId=0 -PtelegramApiHash=
          python3 scripts/verify_offline_apk.py app/build/outputs/apk/debug/app-debug.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
          SANDBOX=app/build/outputs/apk/sandboxDc/app-sandboxDc.apk
          test -s "$SANDBOX"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SANDBOX" | grep "package: name='org.vault.exporter.sandbox.testnet'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$SANDBOX" | grep -q 'android.permission.INTERNET'; then
            echo 'FAIL: offline sandbox APK requests INTERNET'; exit 18
          fi
      - name: Configure hardware-accelerated Android emulation
        run: |
          if test ! -c /dev/kvm; then echo "ABORT: no KVM; refuse unbounded software emulation"; exit 21; fi
          sudo chmod a+rw /dev/kvm
      - name: Android 35 Google APIs ARM64 native-bridge stress in a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            # The runner launches this wrapper with /bin/sh; the real tests run via Bash.
            echo "Emulator ABI: $(adb shell getprop ro.product.cpu.abilist)"
            echo "Android ARM native bridge: $(adb shell getprop ro.dalvik.vm.native.bridge)"
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            # Run the fast install/JNI checks FIRST; if those fail, don't waste a million-word run.
            APK_UNDER_TEST=app/build/outputs/apk/debug/app-debug.apk bash ci/emulator-offline-smoke.sh
            APK_UNDER_TEST=app/build/outputs/apk/sandboxDc/app-sandboxDc.apk bash ci/mega-mixed-media-apk-smoke.sh
      # Deliberately no network Telegram authentication, screenshots artifact,
      # user sessions, phone numbers, developer API keys or external uploads.
