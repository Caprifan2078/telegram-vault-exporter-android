name: Public offline QA (Vault Exporter alpha)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: exporter-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    # Skip all hosted runners while private: avoid spending paid private minutes.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout synthetic source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Crypto, archive, resume, manifest and offline safety tests
        run: bash tests/RUN_TESTS_OFFLINE.sh
      - name: Export engine, mock TDLib lifecycle and JNI host regressions
        run: |
          bash integration-jvm/RUN_INTEGRATION_JVM.sh
          bash transport-jvm/RUN_TRANSPORT_JVM.sh
          bash native-host-test/RUN_NATIVE_HOST_TEST.sh
      - name: CI contract and build safety checks
        run: |
          python3 ci-contract/verify_ci_contract.py
          python3 tests/RUN_BUILD_SAFETY_TESTS.py
      # Deliberately NO TDLib, Telegram login, API IDs, secrets or APK artifacts.
